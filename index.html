<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yemekhane Sistemi - Kayıt Ol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-5">
                    <h3 class="text-center mb-3">Yemekhane Sistemi</h3>
                    <p class="text-muted text-center mb-4">Lütfen üniversite e-posta adresinizle kayıt olun.</p>

                    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-medium">Ad Soyad</label>
                            <input type="text" class="form-control" id="fullName" required placeholder="Adınız Soyadınız">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-medium">Üniversite E-Posta</label>
                            <input type="email" class="form-control" id="email" required placeholder="ornek@stu.atlas.edu.tr">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-medium">Şifre</label>
                            <input type="password" class="form-control" id="password" required placeholder="Şifreniz">
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label fw-medium">Şifre Tekrar</label>
                            <input type="password" class="form-control" id="confirmPassword" required placeholder="Şifrenizi tekrar girin">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Kayıt Ol</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
