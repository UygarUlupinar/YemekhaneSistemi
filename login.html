<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yemekhane Sistemi - Giriş Yap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-5">
                    <h3 class="text-center mb-3">Sisteme Giriş</h3>
                    <p class="text-muted text-center mb-4">Lütfen bilgilerinizi giriniz.</p>

                    <div id="loginAlertBox" class="alert alert-danger d-none" role="alert"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label fw-medium">E-Posta Adresi</label>
                            <input type="email" class="form-control" id="loginEmail" required placeholder="E-posta adresiniz">
                        </div>

                        <div class="mb-4">
                            <label for="loginPassword" class="form-label fw-medium">Şifre</label>
                            <input type="password" class="form-control" id="loginPassword" required placeholder="Şifreniz">
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold mb-3">Giriş Yap</button>
                        
                        <div class="text-center">
                            <span class="text-muted">Hesabınız yok mu?</span>
                            <a href="index.html" class="text-decoration-none fw-medium">Kayıt Ol</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="login.js"></script>
</body>
</html>
